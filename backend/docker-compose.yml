name: monitora-plus

services:
  api:
    build: .
    env_file:
    - .env
    
    restart: unless-stopped
    ports:
    - "127.0.0.1:8000:8000"
    mem_limit: 320m
    cpus: 0.75

    depends_on:
      db:
        condition: service_healthy
    command: gunicorn -w 2 --threads 2 --access-logfile - --error-logfile - -b 0.0.0.0:8000 "app_factory:create_app()"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    environment:
      POSTGRES_DB: monitora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitora"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: [demo]
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://api:8000
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
